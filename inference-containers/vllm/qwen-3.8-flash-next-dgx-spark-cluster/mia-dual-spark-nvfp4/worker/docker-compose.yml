services:
  qwen38-flash-next-worker:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:qwen38-flash-next}
    container_name: qwen38-flash-next-worker
    hostname: inference-server
    network_mode: "host"
    privileged: true
    ipc: "host"
    shm_size: "64gb"
    devices:
      - /dev/infiniband:/dev/infiniband
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.cache/vllm:/root/.cache/vllm

      # Overlay patches for Qwen 3.8 Flash Next stability on Dual DGX Spark
      - ../files/ple_layer_patched.py:/usr/local/lib/python3.12/dist-packages/vllm/models/qwen3_8_flash_next/nvidia/ple_layer.py:ro
      - ../files/modelopt_patched.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/quantization/modelopt.py:ro
      - ../files/qsa_ops_patched.py:/usr/local/lib/python3.12/dist-packages/vllm/models/qwen3_8_flash_next/nvidia/ops/qsa.py:ro
      - ../files/qsa_nvidia_patched.py:/usr/local/lib/python3.12/dist-packages/vllm/models/qwen3_8_flash_next/nvidia/qsa.py:ro
      - ../files/mtp_patched.py:/usr/local/lib/python3.12/dist-packages/vllm/models/qwen3_8_flash_next/nvidia/mtp.py:ro

    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_CACHE_ROOT: /root/.cache/vllm
      VLLM_HOST_IP: "${VLLM_HOST_IP:-10.0.1.2}"

      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      CUDA_VISIBLE_DEVICES: "0"

      # NCCL / RoCE InfiniBand Fabric Configuration
      NCCL_NET: "IB"
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "${NCCL_IB_HCA:-rocep1s0f0,roceP2p1s0f0}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-4,4}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME:-enP7s7}"
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME:-enP7s7}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME:-enP7s7}"
      NCCL_CROSS_NIC: "1"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      NCCL_IB_AUTO_DETECT: "0"

    command:
      - "--model"
      - "${INFERENCE_MODEL:-Mia-AiLab/Qwen3.8-Flash-Next-NVFP4}"
      - "--served-model-name"
      - "${INFERENCE_MODEL_ALIAS:-qwen3.8-flash-next}"
      - "--api-key"
      - "${INFERENCE_API_KEY:-dummy-key}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${INFERENCE_SERVER_PORT:-8000}"
      - "--trust-remote-code"

      # Distributed Parallelism across 2 DGX Sparks (Rank 1 / Worker)
      - "--tensor-parallel-size"
      - "2"
      - "--pipeline-parallel-size"
      - "1"
      - "--enable-expert-parallel"
      - "--all2all-backend"
      - "allgather_reducescatter"
      - "--distributed-executor-backend"
      - "mp"
      - "--nnodes"
      - "2"
      - "--node-rank"
      - "1"
      - "--master-addr"
      - "${MASTER_ADDR:-10.0.1.1}"
      - "--master-port"
      - "${MASTER_PORT:-25000}"
      - "--headless"

      # Memory & KV Cache Tuning (GMU 0.835 gives ~32 GiB KV cache pool per node)
      - "--gpu-memory-utilization"
      - "${INFERENCE_GPU_MEMORY_UTILIZATION:-0.835}"
      - "--max-model-len"
      - "${INFERENCE_MAX_MODEL_LEN:-262144}"
      - "--max-num-seqs"
      - "${INFERENCE_MAX_NUM_SEQS:-8}"
      - "--max-num-batched-tokens"
      - "${INFERENCE_MAX_NUM_BATCHED_TOKENS:-8192}"
      - "--kv-cache-dtype"
      - "${INFERENCE_KV_CACHE_DTYPE:-fp8}"
      - "--load-format"
      - "safetensors"
      - "--safetensors-load-strategy"
      - "lazy"
      - "--enable-chunked-prefill"

      # Multimodal & Speculative Head
      - "--mm-encoder-tp-mode"
      - "data"
      - "--speculative-config"
      - '{"method":"mtp","num_speculative_tokens":3}'
      - "--compilation-config"
      - '{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY"}'

      # Parsers
      - "--reasoning-parser"
      - "qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
